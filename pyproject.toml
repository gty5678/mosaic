[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jav-crawler-server"
version = "0.1.0"
description = "DarkEye 浏览器扩展本地 Worker：FastAPI 网关，与桌面主程序协同完成页面采集与转发。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "DarkEye" }]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.26.0",
]

[project.optional-dependencies]
pyinstaller = ["pyinstaller>=6.0"]

[project.scripts]
darkeye-extension-worker = "main:main"

[tool.setuptools]
py-modules = ["app", "main", "config"]
