[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mosaic-bridge"
version = "0.1.0"
description = "Mosaic Bridge：连接 DarkEye 桌面应用与浏览器扩展的本地 FastAPI 网关。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "DarkEye" }]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.26.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
]

[project.scripts]
mosaic-bridge = "main:main"

[tool.setuptools]
py-modules = ["app", "main", "config"]
